[tasks.aws-sso-login-logiDev]
alias = "al"
description = "SSOでログインして、現在のセッションに認証情報を設定する"
run = "aws-sso-profile LogiDev:AWSAdministratorAccess"

[tasks.dangerous-task]
confirm = "全部消えます。本当に実行するんですか？"
description = "危ないやつ。"
run = "echo 'うそぴょーん'"

[tasks.gcp-config-switch]
alias = "gconf"
description = "GCPプロジェクトの切替え"
run = "sh ~/.config/mise/gconf.sh"

[tasks.explain-commits-with-summary]
alias = "ex"
description = "カレントブランチでの変更内容"
run = "sh ~/.claude/hooks/explain-commits-with-summary.sh"

[tasks.aws-sso-export]
alias = "aws-sso"
description = "AWS SSOで認証し、一時認証情報を環境変数にエクスポートする"
run = "source ~/.config/mise/aws-sso-export.sh"
